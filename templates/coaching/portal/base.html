{% load i18n static %}<!doctype html>
{% get_current_language as LANG %}
<html lang="{{ LANG }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="same-origin">
  <title>{% block title %}{{ client.full_name }}{% endblock %} | Kondis</title>
  <meta name="theme-color" content="#03060b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/kondis.css' %}">
  <script src="{% static 'js/htmx.min.js' %}" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
<div class="portal">
  <header class="portal-top">
    <a class="brand" href="{% url 'portal:home' client.access_token %}">{% include '_logo.html' %}Kondis</a>
    {% with lang_id="portal" %}{% include '_language.html' %}{% endwith %}
  </header>
  {% block content %}{% endblock %}
</div>
</body>
</html>
